<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><meta name="theme-color" content="#1d579b"><title>大奏鼓 · 节奏游戏</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#1d579b;color:#fff;font-family:Arial,"PingFang SC",sans-serif}button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}button:focus-visible{outline:3px solid #fff;outline-offset:5px}[hidden]{display:none!important}#app{max-width:600px;height:100%;height:100dvh;min-height:400px;margin:auto;position:relative;overflow:hidden;background:#1d579b}#home{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;position:relative}.hero{display:flex;align-items:center;width:100%;height:190px;margin:20px 0 0}.hero svg{width:50%;height:100%}.hero svg:first-child{transform:rotate(-16deg)}.hero svg:last-child{transform:rotate(15deg)}h1{font-size:clamp(52px,13vw,84px);letter-spacing:8px;color:#fff000;margin:15px 0 2px;font-weight:900}.eyebrow{letter-spacing:5px;font-size:12px;color:#f7f296}.primary{background:#e92378;color:#fff;font-weight:bold;font-size:18px;padding:18px 55px;border-radius:2px;margin:30px 0 8px;box-shadow:7px 7px 0 #fff000}.hint{font-size:12px;line-height:1.9;text-align:center;color:#f7f296;margin:20px 0}.star{position:absolute;color:#54b2bf;font-size:68px;right:25px;top:30px}.hud{height:76px;padding:20px 19px 12px;display:flex;align-items:center;justify-content:space-between}.hud strong{font-size:26px;letter-spacing:2px}.hud small{font-size:10px;display:block;color:#f7f296;letter-spacing:3px}.lives{font-size:21px;letter-spacing:5px;color:#e92378}#pause{background:none;color:white;font-size:25px;padding:8px}#game{height:100%;display:flex;flex-direction:column}#field{flex:1;position:relative;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none}#notice{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:14px;font-weight:bold;pointer-events:none;color:#fff000;height:22px}.overlay{position:absolute;inset:0;background:#1d579bee;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:5;padding:25px;text-align:center;backdrop-filter:blur(8px)}.overlay h2{font-size:32px;margin:0 0 12px;color:#fff000}.overlay p{color:#f7f296}.overlay strong{font-size:65px}.secondary{padding:15px;color:#fff;background:none;margin-top:12px;font-size:13px}#error{color:#fff000;font-size:12px;text-align:center;position:absolute;bottom:10px;width:100%;padding:0 12px}.sound-note{position:absolute;bottom:13px;font-size:10px;color:#ffffff80}.hud-left{min-width:90px}@media(max-height:650px){.hero{height:130px}h1{font-size:50px}.primary{margin-top:18px}.hint{margin-top:12px}.hud{height:65px}}
</style></head><body><div id="app"><section id="home"><span class="star" aria-hidden="true">✳</span><div class="eyebrow">DA ZOU GU</div><div class="hero"><svg viewBox="0 0 240 200" aria-hidden="true"><ellipse cx="115" cy="66" rx="100" ry="37" transform="rotate(18 115 66)" fill="#f7f296"/><ellipse cx="124" cy="135" rx="100" ry="37" transform="rotate(18 124 135)" fill="#fff000"/><ellipse cx="120" cy="104" rx="100" ry="38" transform="rotate(-15 120 104)" fill="none" stroke="white" stroke-width="8"/><ellipse cx="120" cy="91" rx="100" ry="38" transform="rotate(-15 120 91)" fill="none" stroke="#e92378" stroke-width="9"/><path d="M54 38L60 52 76 45 68 60 83 66 67 71 71 87 58 77 47 89 48 73 32 72 45 61 36 48 52 52Z" fill="#e92378"/></svg><svg viewBox="0 0 240 200"><path d="M170 20L115 110 88 95 148 9Z" fill="#f7f296"/><path d="M112 97L150 121 169 186 22 105 89 87Z" fill="#fff000"/><path d="M29 104L162 180" stroke="#e92378" stroke-width="13"/><path d="M146 41L161 50M135 60L150 69M124 79L138 88" stroke="#1d579b" stroke-width="6"/></svg></div><h1>大奏鼓</h1><div class="eyebrow">跟着节奏，敲响石塘</div><button id="start" class="primary">开始游戏</button><p class="hint">方块碰线时点击 · 唢呐按住至尾部过线<br>累计三次失误，游戏结束</p><span class="sound-note">合成节奏试听版</span></section><section id="game" hidden><header class="hud"><div class="hud-left"><small>得分</small><strong id="score">0</strong></div><span id="lives" class="lives" aria-label="剩余3次机会">●●●</span><button id="pause" aria-label="暂停游戏">Ⅱ</button></header><div id="field"><canvas id="board" aria-label="四轨音乐游戏，请在方块与横线相交时点击；唢呐方块需要长按"></canvas><div id="notice" role="status"></div></div></section><section id="paused" class="overlay" hidden><h2>已暂停</h2><button id="resume" class="primary">继续游戏</button><button class="secondary" id="quit">返回首页</button></section><section id="over" class="overlay" hidden><h2>游戏结束</h2><p>本次得分</p><strong id="finalScore">0</strong><button id="retry" class="primary">再来一次</button><button class="secondary" id="back">返回首页</button></section><p id="error" role="status"></p></div><script>
const $=id=>document.getElementById(id);const canvas=$('board'),pen=canvas.getContext('2d');
let ctx,master,bg,unlocking=false;
function setupAudio(){if(ctx)return;const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('Audio unavailable');ctx=new Audio();master=ctx.createGain();master.gain.value=.55;const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);}
function unlockAudio(){if(unlocking)return;try{setupAudio();if(ctx.state==='running'){$('error').textContent='';return;}unlocking=true;let timeout;Promise.race([ctx.resume(),new Promise((_,reject)=>{timeout=setTimeout(()=>reject(Error('Audio timeout')),1500);})]).then(()=>{if(ctx.state==='running')$('error').textContent='';}).catch(()=>{$('error').textContent='声音未开启：请将文件发布后用浏览器打开；当前可无声试玩。';}).finally(()=>{clearTimeout(timeout);unlocking=false;});}catch(e){$('error').textContent='当前环境不支持声音，可无声试玩。';}}
function connectBackground(){if(!ctx||!master)return;bg=ctx.createGain();bg.gain.value=.65;bg.connect(master);}
function tone(freq,dur,amp,type,t,dest,end){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+dur*.7);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(amp,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02);o.onended=()=>{o.disconnect();g.disconnect()};}
function noise(dur,amp,t,dest){const b=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1);const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type='highpass';f.frequency.value=5500;g.gain.setValueAtTime(amp,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.onended=()=>{s.disconnect();f.disconnect();g.disconnect()};}
function sound(kind,t=ctx?.currentTime??0,dest=master,level=1){if(!ctx||ctx.state!=='running'||!dest)return;if(kind==='drum'){tone(155,.48,.75*level,'sine',t,dest,58);tone(320,.08,.1*level,'triangle',t,dest,85)}if(kind==='wood'){tone(820,.09,.34*level,'sine',t,dest,600);tone(1260,.045,.12*level,'triangle',t,dest)}if(kind==='gong'){[220,331,467,613,902].forEach((f,i)=>tone(f,1.8-i*.21,.18*level/(i+1),'sine',t,dest,f*1.045))}if(kind==='cymbal'){noise(.65,.24*level,t,dest);[1810,2430,3270,4120].forEach(f=>tone(f,.35,.025*level,'square',t,dest))}}


const iconSources={"drum": "<svg viewBox=\"0 0 240 200\" aria-hidden=\"true\"><path d=\"M25 67H215V147Q120 220 25 147Z\" fill=\"#fff000\"/><path d=\"M25 77H215V127Q120 196 25 127Z\" fill=\"white\"/><ellipse cx=\"120\" cy=\"64\" rx=\"95\" ry=\"35\" fill=\"#f7f296\"/><path d=\"M26 80Q73 78 73 122Q73 160 26 153M214 80Q167 78 167 122Q167 160 214 153\" fill=\"#e92378\"/><path d=\"M51 20L103 55M189 15L139 55\" stroke=\"#54b2bf\" stroke-width=\"9\"/></svg>", "gong": "<svg viewBox=\"0 0 240 200\" aria-hidden=\"true\"><circle cx=\"119\" cy=\"106\" r=\"78\" fill=\"none\" stroke=\"white\" stroke-width=\"4\"/><circle cx=\"110\" cy=\"117\" r=\"75\" fill=\"#fff000\"/><circle cx=\"166\" cy=\"54\" r=\"43\" fill=\"#f7f296\"/><path d=\"M166 11A43 43 0 0 1 209 54A43 43 0 0 1 166 97Z\" fill=\"#54b2bf\"/><path d=\"M168 96L177 120 200 106 190 130 216 136 190 144 203 168 178 156 169 184 161 157 135 168 149 145 125 136 151 130 140 105 161 120Z\" fill=\"#e92378\"/></svg>", "cymbal": "<svg viewBox=\"0 0 240 200\" aria-hidden=\"true\"><ellipse cx=\"115\" cy=\"66\" rx=\"100\" ry=\"37\" transform=\"rotate(18 115 66)\" fill=\"#f7f296\"/><ellipse cx=\"124\" cy=\"135\" rx=\"100\" ry=\"37\" transform=\"rotate(18 124 135)\" fill=\"#fff000\"/><ellipse cx=\"120\" cy=\"104\" rx=\"100\" ry=\"38\" transform=\"rotate(-15 120 104)\" fill=\"none\" stroke=\"white\" stroke-width=\"8\"/><ellipse cx=\"120\" cy=\"91\" rx=\"100\" ry=\"38\" transform=\"rotate(-15 120 91)\" fill=\"none\" stroke=\"#e92378\" stroke-width=\"9\"/><path d=\"M54 38L60 52 76 45 68 60 83 66 67 71 71 87 58 77 47 89 48 73 32 72 45 61 36 48 52 52Z\" fill=\"#e92378\"/></svg>", "wood": "<svg viewBox=\"0 0 240 200\" aria-hidden=\"true\"><path d=\"M22 100Q77 14 163 100Q77 186 22 100Z\" fill=\"#fff000\"/><path d=\"M163 100Q190 68 220 63V137Q190 134 163 100\" fill=\"#f7f296\"/><path d=\"M143 100L163 77 182 100 163 123Z\" fill=\"#1d579b\"/><path d=\"M180 25L116 83\" stroke=\"#e92378\" stroke-width=\"10\"/><circle cx=\"112\" cy=\"87\" r=\"15\" fill=\"#54b2bf\"/></svg>", "suona": "<svg viewBox=\"0 0 240 200\"><path d=\"M170 20L115 110 88 95 148 9Z\" fill=\"#f7f296\"/><path d=\"M112 97L150 121 169 186 22 105 89 87Z\" fill=\"#fff000\"/><path d=\"M29 104L162 180\" stroke=\"#e92378\" stroke-width=\"13\"/><path d=\"M146 41L161 50M135 60L150 69M124 79L138 88\" stroke=\"#1d579b\" stroke-width=\"6\"/></svg>"},images={};for(const [k,svg] of Object.entries(iconSources)){const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '));images[k]=im;}
const names={drum:'大鼓',gong:'小锣',cymbal:'铜钹',wood:'木鱼',suona:'唢呐'};
const colors={drum:'#e92378',gong:'#54b2bf',cymbal:'#e92378',wood:'#54b2bf',suona:'#f7f296'};
let state='home',notes=[],holds=new Map(),score=0,misses=0,w=0,h=0,line=0,speed=0,tile=0,startClock=0,elapsed=0,raf=0,lastBeat=-1,nextAt=3,available=[0,0,0,0],noteId=0,feedbackUntil=0;
const beat=60/108;function now(){return state==='playing'?(performance.now()-startClock)/1000:elapsed;}
function dimensions(){const r=$('field').getBoundingClientRect();w=r.width;h=r.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);pen.setTransform(d,0,0,d,0,0);line=h*.8;speed=line/2.5;tile=Math.max(65,Math.min(105,h*.18));}
function hud(){$('score').textContent=score;$('lives').textContent='●'.repeat(3-misses)+'○'.repeat(misses);$('lives').setAttribute('aria-label','剩余'+(3-misses)+'次机会');}
function feedback(text){$('notice').textContent=text;feedbackUntil=now()+.7;}
function clearSound(){for(const n of notes)if(n.voice){n.voice();n.voice=null;}if(bg){bg.disconnect();bg=null;}}
function voice(){if(!ctx||ctx.state!=='running')return()=>{};const bus=ctx.createGain(),filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=2600;bus.gain.setValueAtTime(.0001,ctx.currentTime);bus.gain.exponentialRampToValueAtTime(.17,ctx.currentTime+.04);bus.connect(filter);filter.connect(master);const os=[];for(const [f,a] of [[440,.7],[880,.2],[1320,.1]]){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.value=a;o.connect(g);g.connect(bus);o.start();os.push(o);}let stopped=false;return()=>{if(stopped)return;stopped=true;bus.gain.setTargetAtTime(.0001,ctx.currentTime,.015);os.forEach(o=>o.stop(ctx.currentTime+.08));setTimeout(()=>{bus.disconnect();filter.disconnect();os.forEach(o=>o.disconnect());},150);};}
function end(){state='over';cancelAnimationFrame(raf);clearSound();holds.clear();$('finalScore').textContent=score;$('over').hidden=false;}
function fail(n){if(n&&n.done)return;if(n){n.done=true;if(n.voice)n.voice();n.voice=null;if(n.pointer!==undefined)holds.delete(n.pointer);}misses++;hud();feedback('失误');if(misses>=3)end();}
function success(n){if(n.done)return;n.done=true;if(n.voice)n.voice();n.voice=null;if(n.pointer!==undefined)holds.delete(n.pointer);score+=n.kind==='suona'?30:10;hud();feedback(n.kind==='suona'?'长音完成 +30':'+10');}
function spawn(t){while(nextAt<t+3){const candidates=available.map((v,i)=>v<=nextAt?i:-1).filter(i=>i>=0);if(!candidates.length){nextAt+=beat;continue;}const lane=candidates[Math.floor(Math.random()*candidates.length)];const kind=Math.random()<.2?'suona':['drum','gong','cymbal','wood'][Math.floor(Math.random()*4)];const dur=kind==='suona'?beat*2:0;notes.push({id:noteId++,lane,kind,at:nextAt,dur,done:false,held:false});available[lane]=nextAt+dur+beat*1.4;nextAt+=beat;}}
function geometry(n,t){const bottom=line+(t-n.at)*speed;const length=n.kind==='suona'?n.dur*speed:tile;return{x:n.lane*w/4+6,y:bottom-length,width:w/4-12,height:length,bottom};}
function intersects(n,t){const r=geometry(n,t);return r.y<=line&&r.bottom>=line;}
function update(t){spawn(t);for(const n of notes){if(n.done)continue;if(n.held&&t>=n.at+n.dur){success(n);continue;}const grace=n.kind==='suona'?.2:tile/speed;if(!n.held&&t>n.at+grace){fail(n);if(state!=='playing')break;}}notes=notes.filter(n=>!n.done||t<n.at+n.dur+1);}
function background(t){if(!ctx||ctx.state!=='running'||!bg)return;const b=Math.floor(t/beat);if(b===lastBeat)return;lastBeat=b;if(b%2===0)sound('drum',ctx.currentTime,bg,.23);sound('wood',ctx.currentTime,bg,.15);if(b%8===0)sound('gong',ctx.currentTime,bg,.13);if(b%8===6)sound('cymbal',ctx.currentTime,bg,.15);}
function draw(t){pen.clearRect(0,0,w,h);pen.fillStyle='#1d579b';pen.fillRect(0,0,w,h);for(let i=0;i<4;i++){if(i%2===0){pen.fillStyle='#ffffff05';pen.fillRect(i*w/4,0,w/4,h);}pen.strokeStyle='#ffffff20';pen.beginPath();pen.moveTo(i*w/4,0);pen.lineTo(i*w/4,h);pen.stroke();}for(const n of notes){if(n.done)continue;const r=geometry(n,t);if(r.bottom<0||r.y>h)continue;pen.fillStyle=n.held?'#fff000':colors[n.kind];pen.fillRect(r.x,r.y,r.width,r.height);if(n.kind==='suona'){pen.fillStyle='#1d579b30';pen.fillRect(r.x+r.width/2-3,r.y+16,6,Math.max(0,r.height-90));}const size=Math.min(r.width-8,88);const iy=n.kind==='suona'?r.bottom-size-23:r.y+4;const im=images[n.kind];if(im.complete&&im.naturalWidth)pen.drawImage(im,r.x+(r.width-size)/2,iy,size,size*.83);pen.fillStyle=n.kind==='suona'?'#1d579b':'#fff';pen.font='bold 11px Arial';pen.textAlign='center';pen.fillText(names[n.kind],r.x+r.width/2,r.bottom-10);if(n.held){pen.strokeStyle='#fff';pen.lineWidth=3;pen.strokeRect(r.x+2,r.y+2,r.width-4,r.height-4);}}pen.fillStyle='#fff000';pen.fillRect(0,line-2,w,4);for(let i=0;i<4;i++){pen.beginPath();pen.arc((i+.5)*w/4,line,5,0,Math.PI*2);pen.fill();}if(t<2.5){pen.fillStyle='#fff000';pen.font='bold 58px Arial';pen.textAlign='center';pen.fillText(String(Math.ceil(2.5-t)),w/2,h*.46);}}
function frame(){if(state!=='playing')return;const t=now();update(t);if(state!=='playing')return;background(t);draw(t);if(t>feedbackUntil)$('notice').textContent='';raf=requestAnimationFrame(frame);}
function start(){if(state==='playing')return;$('error').textContent='';unlockAudio();clearSound();notes=[];holds.clear();score=0;misses=0;elapsed=0;nextAt=3;available=[0,0,0,0];lastBeat=-1;noteId=0;$('home').hidden=true;$('over').hidden=true;$('paused').hidden=true;$('game').hidden=false;$('notice').textContent='';hud();dimensions();connectBackground();state='playing';startClock=performance.now();cancelAnimationFrame(raf);frame();}
function pause(){if(state!=='playing')return;elapsed=now();state='paused';cancelAnimationFrame(raf);clearSound();holds.clear();for(const n of notes)if(n.held){const remaining=Math.max(.15,n.at+n.dur-elapsed);n.held=false;n.at=elapsed+.5;n.dur=remaining;} $('paused').hidden=false;}
function resume(){if(state!=='paused')return;unlockAudio();connectBackground();startClock=performance.now()-elapsed*1000;state='playing';$('paused').hidden=true;cancelAnimationFrame(raf);frame();}
function home(){state='home';cancelAnimationFrame(raf);clearSound();holds.clear();$('home').hidden=false;$('game').hidden=true;$('over').hidden=true;$('paused').hidden=true;}
canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();if(!ctx||ctx.state!=='running')unlockAudio();const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,t=now();const n=notes.find(n=>{if(n.done||n.held)return false;const r=geometry(n,t);return x>=r.x&&x<=r.x+r.width&&y>=r.y&&y<=r.bottom;});if(!n){fail();return;}if(!intersects(n,t)||(n.kind==='suona'&&t>n.at+.2)){fail(n);return;}if(n.kind==='suona'){n.held=true;n.pointer=e.pointerId;holds.set(e.pointerId,n);n.voice=voice();canvas.setPointerCapture(e.pointerId);feedback('按住');}else{sound(n.kind);success(n);}});
function release(e){const n=holds.get(e.pointerId);if(!n)return;holds.delete(e.pointerId);if(state!=='playing')return;if(now()>=n.at+n.dur-.06)success(n);else fail(n);}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',e=>{const n=holds.get(e.pointerId);if(n&&state==='playing')fail(n);});canvas.addEventListener('contextmenu',e=>e.preventDefault());
$('start').onclick=start;$('retry').onclick=start;$('pause').onclick=pause;$('resume').onclick=resume;$('back').onclick=home;$('quit').onclick=home;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});window.addEventListener('resize',()=>{if(state==='playing')pause();if(state==='paused'){dimensions();draw(elapsed);}});
</script></body></html>
